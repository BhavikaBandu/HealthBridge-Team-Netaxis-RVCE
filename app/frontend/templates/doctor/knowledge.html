{% extends 'portal/app_base.html' %}
{% block content %}
<div class="hb-card mb-4">
  <div class="kx-hero">
    <span class="kx-icon"><i class="bi bi-journal-medical"></i></span>
    <h2 class="h4 mt-3 mb-1">Explore Medical Knowledge</h2>
    <p class="hb-muted mb-0">Search official reference sources for medicines, medical reports, procedures and policies. Every result links to its original source.</p>
    <form id="searchForm" class="kx-search" role="search">
      <div class="input-group">
        <span class="input-group-text bg-white"><i class="bi bi-search"></i></span>
        <input id="query" class="form-control" maxlength="200" autocomplete="off" aria-label="Search medical knowledge"
               placeholder="Search by name, code, identifier, keyword or description...">
        <button class="btn btn-primary px-4" type="submit">Search</button>
      </div>
    </form>
    <ul class="kx-tiles" id="workflowTabs" aria-label="Filter by knowledge area">
      <li><button class="nav-link active" data-workflow="" type="button"><i class="bi bi-grid"></i>All<span class="badge rounded-pill" data-count=""></span></button></li>
      <li><button class="nav-link" data-workflow="medicines" type="button"><i class="bi bi-capsule"></i>Medicines<span class="badge rounded-pill" data-count="medicines"></span></button></li>
      <li><button class="nav-link" data-workflow="medical_reports" type="button"><i class="bi bi-clipboard2-pulse"></i>Medical Reports<span class="badge rounded-pill" data-count="medical_reports"></span></button></li>
      <li><button class="nav-link" data-workflow="procedures" type="button"><i class="bi bi-bandaid"></i>Procedures<span class="badge rounded-pill" data-count="procedures"></span></button></li>
      <li><button class="nav-link" data-workflow="policies" type="button"><i class="bi bi-globe2"></i>Policies<span class="badge rounded-pill" data-count="policies"></span></button></li>
    </ul>
  </div>
</div>

<div id="notice" class="alert alert-info py-2 small d-none" role="status"></div>
<div id="emptyWorkflow" class="alert alert-warning d-none" role="status"></div>

<div id="resultsArea" class="kx-results">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2 class="h5 m-0">Results</h2>
    <span id="status" class="text-muted small"></span>
  </div>
  <div id="results" class="row g-3"></div>
  <div class="d-flex gap-2 mt-4 mb-2 align-items-center">
    <button id="prev" class="btn btn-outline-secondary" disabled>Previous</button>
    <button id="next" class="btn btn-outline-secondary" disabled>Next</button>
    <span id="pageInfo" class="text-muted small ms-2"></span>
  </div>
</div>

<div class="modal fade" id="detailModal" tabindex="-1" aria-labelledby="detailTitle">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header"><h3 id="detailTitle" class="modal-title fs-5"></h3><button class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body" id="detailBody"></div>
    </div>
  </div>
</div>
{% endblock %}
{% block scripts %}<script src="/static/js/common.js?v={{ v }}"></script><script src="/static/js/app.js?v={{ v }}"></script>{% endblock %}
