<!-- Medication form -->
<div class="modal fade" id="medicationsModal" tabindex="-1" aria-labelledby="medTitle">
  <div class="modal-dialog modal-dialog-centered modal-lg modal-dialog-scrollable"><div class="modal-content">
    <form novalidate data-kind="medications">
      <div class="modal-header"><h5 class="modal-title" id="medTitle">Add Medication</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="form-alert alert alert-danger small d-none" role="alert"></div>
        <div class="row g-3">
          <div class="col-12"><label class="form-label" for="m_name">Medicine name <span class="req">*</span></label>
            <input class="form-control" id="m_name" name="name" maxlength="200" placeholder="As written on the pack or prescription" required></div>
          <div class="col-md-6"><label class="form-label" for="m_brand">Brand name</label><input class="form-control" id="m_brand" name="brand" maxlength="200"></div>
          <div class="col-md-6"><label class="form-label" for="m_man">Manufacturer / company</label><input class="form-control" id="m_man" name="manufacturer" maxlength="200"></div>
          <div class="col-md-4"><label class="form-label" for="m_sv">Strength</label>
            <div class="input-group"><input class="form-control" id="m_sv" name="strength_value" type="number" min="0" step="any" placeholder="500">
              <select class="form-select" name="strength_unit" aria-label="Strength unit" style="max-width:6.5rem"><option value="">unit</option></select></div></div>
          <div class="col-md-4"><label class="form-label" for="m_form">Dosage form</label><select class="form-select" id="m_form" name="dosage_form"><option value="">Select</option></select></div>
          <div class="col-md-4"><label class="form-label" for="m_dose">Dose per intake</label><input class="form-control" id="m_dose" name="dose" maxlength="100" placeholder="e.g. 1 tablet"></div>
          <div class="col-12"><label class="form-label">When do you take it?</label>
            <div class="d-flex flex-wrap gap-3">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="s_m" name="sch_morning"><label class="form-check-label" for="s_m">Morning</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="s_a" name="sch_afternoon"><label class="form-check-label" for="s_a">Afternoon</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="s_n" name="sch_night"><label class="form-check-label" for="s_n">Night</label></div>
              <div class="form-check"><input class="form-check-input" type="checkbox" id="s_p" name="sch_as_needed"><label class="form-check-label" for="s_p">As needed</label></div>
            </div>
            <input class="form-control mt-2" name="sch_custom" maxlength="200" placeholder="Custom timing (optional), e.g. every 8 hours"></div>
          <div class="col-md-6"><label class="form-label" for="m_start">Start date <span class="req">*</span></label>
            <input class="form-control" id="m_start" name="start_date" type="date">
            <div class="form-check mt-1"><input class="form-check-input" type="checkbox" id="m_unknown" name="start_date_unknown"><label class="form-check-label small" for="m_unknown">Start date unknown</label></div></div>
          <div class="col-md-6"><label class="form-label d-block">Currently taking?</label>
            <div class="form-check form-switch"><input class="form-check-input" type="checkbox" role="switch" id="m_ongoing" name="ongoing" checked><label class="form-check-label" for="m_ongoing">Ongoing</label></div>
            <div id="stopWrap" class="mt-2 d-none"><label class="form-label" for="m_stop">Stop date <span class="req">*</span></label><input class="form-control" id="m_stop" name="stop_date" type="date"></div></div>
          <div class="col-12"><label class="form-label" for="m_instr">Additional instructions</label><textarea class="form-control" id="m_instr" name="instructions" rows="2" maxlength="1000" placeholder="e.g. Take after food"></textarea></div>
        </div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" data-save>Save Medication</button></div>
    </form>
  </div></div>
</div>

<!-- Condition form -->
<div class="modal fade" id="conditionsModal" tabindex="-1" aria-labelledby="condTitle">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form novalidate data-kind="conditions">
      <div class="modal-header"><h5 class="modal-title" id="condTitle">Add Condition</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="form-alert alert alert-danger small d-none" role="alert"></div>
        <div class="mb-3"><label class="form-label" for="c_name">Condition name <span class="req">*</span></label>
          <input class="form-control" id="c_name" name="name" maxlength="200" placeholder="In your own words" required></div>
        <div class="row g-3 mb-3">
          <div class="col-sm-7"><label class="form-label" for="c_date">Diagnosis date</label><input class="form-control" id="c_date" name="diagnosis_date" type="date"></div>
          <div class="col-sm-5"><label class="form-label" for="c_year">or year only</label><input class="form-control" id="c_year" name="diagnosis_year" type="number" min="1900" max="2100" placeholder="2019"></div>
        </div>
        <div class="mb-3"><label class="form-label" for="c_status">Status</label>
          <select class="form-select" id="c_status" name="status"><option value="active">Active</option><option value="resolved">Resolved</option><option value="unknown">Unknown</option></select></div>
        <div><label class="form-label" for="c_notes">Notes</label><textarea class="form-control" id="c_notes" name="notes" rows="2" maxlength="2000"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" data-save>Save Condition</button></div>
    </form>
  </div></div>
</div>

<!-- Procedure form -->
<div class="modal fade" id="proceduresModal" tabindex="-1" aria-labelledby="procTitle">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form novalidate data-kind="procedures">
      <div class="modal-header"><h5 class="modal-title" id="procTitle">Add Procedure or Surgery</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="form-alert alert alert-danger small d-none" role="alert"></div>
        <div class="mb-3"><label class="form-label" for="p_name">Procedure name <span class="req">*</span></label><input class="form-control" id="p_name" name="name" maxlength="200" required></div>
        <div class="row g-3 mb-3">
          <div class="col-sm-6"><label class="form-label" for="p_date">Date</label><input class="form-control" id="p_date" name="procedure_date" type="date"></div>
          <div class="col-sm-6"><label class="form-label" for="p_status">Status</label>
            <select class="form-select" id="p_status" name="status"><option value="completed">Completed</option><option value="planned">Planned</option></select></div>
          <div class="col-sm-6"><label class="form-label" for="p_country">Country</label><select class="form-select" id="p_country" name="country"></select></div>
          <div class="col-sm-6"><label class="form-label" for="p_hosp">Hospital / clinic</label><input class="form-control" id="p_hosp" name="hospital" maxlength="200"></div>
        </div>
        <div><label class="form-label" for="p_notes">Notes</label><textarea class="form-control" id="p_notes" name="notes" rows="2" maxlength="2000"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" data-save>Save Procedure</button></div>
    </form>
  </div></div>
</div>

<!-- Allergy form -->
<div class="modal fade" id="allergiesModal" tabindex="-1" aria-labelledby="algTitle">
  <div class="modal-dialog modal-dialog-centered"><div class="modal-content">
    <form novalidate data-kind="allergies">
      <div class="modal-header"><h5 class="modal-title" id="algTitle">Add Allergy</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="form-alert alert alert-danger small d-none" role="alert"></div>
        <div class="mb-3"><label class="form-label" for="a_allergen">Allergen <span class="req">*</span></label><input class="form-control" id="a_allergen" name="allergen" maxlength="200" placeholder="e.g. Penicillin, peanuts" required></div>
        <div class="mb-3"><label class="form-label" for="a_reaction">Reaction</label><input class="form-control" id="a_reaction" name="reaction" maxlength="300" placeholder="e.g. Rash, swelling"></div>
        <div class="mb-3"><label class="form-label" for="a_sev">Severity</label>
          <select class="form-select" id="a_sev" name="severity"><option value="unknown">Unknown</option><option value="mild">Mild</option><option value="moderate">Moderate</option><option value="severe">Severe</option></select></div>
        <div><label class="form-label" for="a_notes">Notes</label><textarea class="form-control" id="a_notes" name="notes" rows="2" maxlength="2000"></textarea></div>
      </div>
      <div class="modal-footer"><button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" data-save>Save Allergy</button></div>
    </form>
  </div></div>
</div>
