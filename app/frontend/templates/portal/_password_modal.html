<div class="modal fade" id="pwModal" tabindex="-1" aria-labelledby="pwTitle">
  <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable"><div class="modal-content">
    <form id="pwForm" novalidate>
      <div class="modal-header"><h5 class="modal-title" id="pwTitle">Change Password</h5><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
      <div class="modal-body">
        <div class="form-alert alert alert-danger small d-none" role="alert"></div>
        <div class="mb-3"><label class="form-label" for="current_password">Current password</label>
          <div class="input-group"><input class="form-control" id="current_password" name="current_password" type="password" autocomplete="current-password" maxlength="128" required>
            <button class="btn btn-toggle-pw" type="button" data-toggle-pw aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
        <div class="mb-3"><label class="form-label" for="new_password">New password</label>
          <div class="input-group"><input class="form-control" id="new_password" name="new_password" type="password" autocomplete="new-password" maxlength="128" required>
            <button class="btn btn-toggle-pw" type="button" data-toggle-pw aria-label="Show password"><i class="bi bi-eye"></i></button></div>
          <ul class="pw-rules" id="pwRules" aria-label="Password requirements"></ul></div>
        <div class="mb-1"><label class="form-label" for="confirm_new_password">Confirm new password</label>
          <div class="input-group"><input class="form-control" id="confirm_new_password" name="confirm_new_password" type="password" autocomplete="new-password" maxlength="128" required>
            <button class="btn btn-toggle-pw" type="button" data-toggle-pw aria-label="Show password"><i class="bi bi-eye"></i></button></div></div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
        <button type="submit" class="btn btn-primary" id="pwSave">Update Password</button>
      </div>
    </form>
  </div></div>
</div>
